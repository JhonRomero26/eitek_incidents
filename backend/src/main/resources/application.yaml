spring:
  application:
    name: IncidentsManager
  datasource:
    url: jdbc:postgresql://localhost:5432/eitek
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
